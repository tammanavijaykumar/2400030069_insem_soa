
spring.application.name=RESTAURANT-SERVICE
server.port=0

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.home-page-url=http://localhost:8080/restaurants
eureka.instance.status-page-url=http://localhost:8080/restaurants

management.endpoints.web.exposure.include=health,info
management.endpoint.info.access=unrestricted
management.info.env.enabled=true

info.app.name=Restaurant Service
info.app.description=Food Delivery Restaurant Microservice
info.app.status=Running
